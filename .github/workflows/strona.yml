name: Strona i dane

on:
  schedule:
    - cron: '*/20 * * * *'      # co 20 minut (GitHub może opóźnić o kilka minut)
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}          # uprawnienia nadawane per zadanie (audyt 24.09, B10)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  zbuduj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy zbieracza (brak nie jest zerem, zakres dat, pamięć podręczna) — awaria blokuje publikację
        run: PYTHONPATH=narzedzia/bez_sieci PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_zbieraj_dane.py   # v122: sieć zablokowana — próba połączenia w teście = kod 3, publikacja staje
      - name: Test bramki strony dla plików widoków silnika (bez przeglądarki) — awaria blokuje publikację
        run: node --test test_widoki.cjs
      - name: Przywróć pamięć zbieracza (ostatnie pliki danych; przeżywa awarię publikacji strony)
        uses: actions/cache/restore@v4
        with:
          path: pamiec-danych
          key: dane-${{ github.run_id }}
          restore-keys: dane-
      - name: Zbierz dane (klucze tylko z Secrets)
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}             # v121: insiderzy — adres e-mail do nagłówka zapytań EDGAR (wymóg urzędu); nigdy w plikach strony
          SOSOVALUE_KEY: ${{ secrets.SOSOVALUE_KEY }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          COINMARKETCAP_KEY: ${{ secrets.COINMARKETCAP_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}               # v97: energia (EIA)
          BLS_KEY: ${{ secrets.BLS_KEY }}               # v97: makro USA (BLS)
          BEA_KEY: ${{ secrets.BEA_KEY }}               # v97: bilans płatniczy USA (BEA)
          EODHD_KEY: ${{ secrets.EODHD || secrets.EODHD_KEY }}                       # v106: indeksy świata (nazwa sekretu właściciela: EODHD)
          MASSIVE_KEY: ${{ secrets.MASSIVEPOLYGON || secrets.MASSIVE_KEY }}         # v106: notowania ETF (dawniej Polygon; sekret: MASSIVEPOLYGON)
          TIINGO_KEY: ${{ secrets.TIINGO || secrets.TIINGO_KEY }}                    # v106: notowania ETF (zapas; sekret: TIINGO)
          FMP_KEY: ${{ secrets.FINANCIALMODELINGPREP || secrets.FMP_KEY }}           # v106: FMP (sekret: FINANCIALMODELINGPREP)
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE || secrets.ALPHAVANTAGE_KEY }}  # (sekret: ALPHAVANTAGE)
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN || secrets.ETHERSCAN_KEY }}           # wieloryby: transfery ETH natywne (w przygotowaniu)
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC || secrets.CRYPTOPANIC_KEY }}     # wiadomości (w przygotowaniu)
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}                                         # handel zagraniczny USA (w przygotowaniu)
          CACHE_DIR: pamiec-danych
          # strona użytkownika (repozytorium <konto>.github.io) ma adres bez ścieżki; inne — z nazwą repozytorium
          SITE_URL: ${{ endsWith(github.event.repository.name, '.github.io') && format('https://{0}', github.event.repository.name) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python3 zbieraj_dane.py
      - name: Zapisz pamięć zbieracza
        if: always()
        run: mkdir -p pamiec-danych && cp data/*.json pamiec-danych/ 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pamiec-danych
          key: dane-${{ github.run_id }}
      - name: Złóż stronę
        run: |
          mkdir -p _site/data _site/data/widoki
          cp index.html _site/
          cp -r fonts _site/fonts                      # czcionki z tej samej strony (v34) — bez tego zmienia się wygląd
          cp -r img _site/img                          # v96: flagi i loga (SVG z tej samej strony) — bez nich strona bez ikon
          test -f _site/img/flagi/pl.svg                # brak ikon = przerwij publikację
          cp data/*.json _site/data/ 2>/dev/null || true
          cp data/widoki/*.json _site/data/widoki/ 2>/dev/null || true   # widoki silnika (v35), gdy już będą
          test -f _site/fonts/fonts.css                 # brak czcionek = przerwij publikację
          cp robots.txt google433f7c24524100a9.html _site/   # v111: wyszukiwarki (robots, weryfikacja Google metodą pliku)
          if [ -d archiwum ]; then cp -r archiwum _site/archiwum; fi   # v113: archiwum własne (CSV + indeks.json) — wykresy 30/90/365 dni
          sed "s/LASTMOD/$(date -u +%Y-%m-%d)/g" sitemap.xml > _site/sitemap.xml
          test -f _site/sitemap.xml && test -f _site/robots.txt
          touch _site/.nojekyll
          ls -la _site _site/data
      - name: Straż kluczy — wartość żadnego sekretu nie może być w plikach strony (znalezisko = publikacja przerwana)
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          SOSOVALUE_KEY: ${{ secrets.SOSOVALUE_KEY }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          COINMARKETCAP_KEY: ${{ secrets.COINMARKETCAP_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}
          BLS_KEY: ${{ secrets.BLS_KEY }}
          BEA_KEY: ${{ secrets.BEA_KEY }}
          EODHD_KEY: ${{ secrets.EODHD || secrets.EODHD_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVEPOLYGON || secrets.MASSIVE_KEY }}
          TIINGO_KEY: ${{ secrets.TIINGO || secrets.TIINGO_KEY }}
          FMP_KEY: ${{ secrets.FINANCIALMODELINGPREP || secrets.FMP_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE || secrets.ALPHAVANTAGE_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN || secrets.ETHERSCAN_KEY }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC || secrets.CRYPTOPANIC_KEY }}
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
        run: python3 narzedzia/straz_kluczy.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  opublikuj:
    needs: zbuduj
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
